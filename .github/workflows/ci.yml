name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            packages
          key: windows-cargo-${{ hashFiles('Cargo.lock', 'packages.config') }}
          restore-keys: |
            windows-cargo-

      - name: Restore GameInput
        shell: pwsh
        run: cargo xtask gameinput sync

      - name: Format
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Test
        shell: pwsh
        run: cargo test --workspace

      - name: Clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Release build
        shell: pwsh
        run: cargo build --release
